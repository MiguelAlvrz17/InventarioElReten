<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario El Retén</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:40px;
}

h1{
    font-size:60px;
    margin-bottom:0;
}

h2{
    margin-top:10px;
    color:#666;
    font-weight:normal;
}

#codigo,
#buscarNombre{
    width:500px;
    max-width:90%;
    font-size:28px;
    padding:15px;
    text-align:center;
}

#producto{
    margin-top:40px;
    font-size:48px;
    font-weight:bold;
}

#categoria{
    margin-top:10px;
    font-size:24px;
    color:#666;
}

#precio{
    margin-top:20px;
    font-size:100px;
    color:green;
    font-weight:bold;
}

.error{
    color:red;
}

#resultados{
    margin-top:40px;
}

table{
    width:100%;
    max-width:1000px;
    margin:auto;
    border-collapse:collapse;
    background:white;
}

th, td{
    border:1px solid #ddd;
    padding:12px;
}

th{
    background:#f0f0f0;
}

tr:hover{
    background:#fafafa;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>EL RETÉN</h1>
<h2>Consulta de precios</h2>

<br>

<div>
    <strong>Escanear código</strong>
    <br><br>

    <input
        id="codigo"
        type="text"
        autofocus
        placeholder="Escanea aquí"
    />
</div>

<br><br>

<div>
    <strong>Buscar producto</strong>
    <br><br>

    <input
        id="buscarNombre"
        type="text"
        placeholder="Ej. Fanta"
    />
</div>

<div id="producto"></div>
<div id="categoria"></div>
<div id="precio"></div>

<div id="resultados"></div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlYlGGf3oqk2WOcEpsJOPJlJZgM1-L01wyxY9thivXBgeqVzQsLcJp7thmwZMruCjo5E5HyYOdMv4m/pub?output=csv";

let inventario = {};
let productos = [];

function normalizar(texto){
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

async function cargarDatos(){

    const respuesta = await fetch(CSV_URL);
    const texto = await respuesta.text();

    const filas = texto.trim().split("\\n");

    for(let i = 1; i < filas.length; i++){

        const columnas = filas[i].split(",");

        const codigo = columnas[0]?.trim();
        const producto = columnas[1]?.trim();
        const precio = columnas[2]?.trim();
        const categoria = columnas[3]?.trim();

        if(!codigo) continue;

        const item = {
            codigo,
            producto,
            precio,
            categoria
        };

        inventario[codigo] = item;
        productos.push(item);
    }

    console.log("Productos cargados:", productos.length);
}

cargarDatos();

function mostrarProducto(codigo){

    const producto = inventario[codigo];

    if(!producto) return;

    document.getElementById("producto").classList.remove("error");

    document.getElementById("producto").textContent =
        producto.producto;

    document.getElementById("categoria").textContent =
        producto.categoria;

    document.getElementById("precio").textContent =
        producto.precio;
}

const inputCodigo = document.getElementById("codigo");

inputCodigo.addEventListener("change", ()=>{

    const codigo = inputCodigo.value.trim();

    if(inventario[codigo]){

        mostrarProducto(codigo);

    }else{

        document.getElementById("producto")
            .classList.add("error");

        document.getElementById("producto")
            .textContent = "PRODUCTO NO REGISTRADO";

        document.getElementById("categoria")
            .textContent = "";

        document.getElementById("precio")
            .textContent = codigo;
    }

    inputCodigo.value = "";
    inputCodigo.focus();
});

const buscador =
    document.getElementById("buscarNombre");

buscador.addEventListener("input", ()=>{

    const textoBusqueda =
        normalizar(buscador.value.trim());

    const resultados =
        document.getElementById("resultados");

    if(textoBusqueda.length < 2){

        resultados.innerHTML = "";
        return;
    }

    const encontrados = productos.filter(p =>
        normalizar(p.producto)
            .includes(textoBusqueda)
    );

    if(encontrados.length === 0){

        resultados.innerHTML =
            "<p>No se encontraron productos.</p>";

        return;
    }

    resultados.innerHTML = `
        <h3>${encontrados.length} productos encontrados</h3>

        <table>
            <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Precio</th>
            </tr>

            ${encontrados.map(p => `
                <tr onclick="mostrarProducto('${p.codigo}')">
                    <td>${p.producto}</td>
                    <td>${p.categoria}</td>
                    <td>${p.precio}</td>
                </tr>
            `).join("")}
        </table>
    `;
});

</script>

</body>
</html>
