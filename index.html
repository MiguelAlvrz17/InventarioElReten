<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario El Retén</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:40px;
}

h1{
    font-size:50px;
}

#codigo{
    width:500px;
    max-width:90%;
    font-size:32px;
    padding:15px;
    text-align:center;
}

#producto{
    margin-top:50px;
    font-size:48px;
    font-weight:bold;
}

#precio{
    margin-top:20px;
    font-size:100px;
    color:green;
    font-weight:bold;
}

.error{
    color:red;
}
</style>
</head>
<body>

<h1>ESCANEA UN PRODUCTO</h1>

<input
    id="codigo"
    type="text"
    autofocus
    placeholder="Escanea aquí"
/>

<div id="producto"></div>
<div id="precio"></div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTlYlGGf3oqk2WOcEpsJOPJlJZgM1-L01wyxY9thivXBgeqVzQsLcJp7thmwZMruCjo5E5HyYOdMv4m/pub?output=csv";

let inventario = {};

async function cargarDatos() {

    const respuesta = await fetch(CSV_URL);
    const texto = await respuesta.text();

    const filas = texto.trim().split("\n");

    for(let i=1;i<filas.length;i++){

        const columnas = filas[i].split(",");

        const codigo = columnas[0]?.trim();
        const producto = columnas[1]?.trim();
        const precio = columnas[2]?.trim();

        inventario[codigo] = {
            producto,
            precio
        };
    }

    console.log("Productos cargados:", Object.keys(inventario).length);
}

cargarDatos();

const input = document.getElementById("codigo");

input.addEventListener("change", ()=>{

    const codigo = input.value.trim();

    const productoDiv = document.getElementById("producto");
    const precioDiv = document.getElementById("precio");

    if(inventario[codigo]){

        productoDiv.classList.remove("error");

        productoDiv.textContent =
            inventario[codigo].producto;

        precioDiv.textContent =
            "$" + inventario[codigo].precio;

    }else{

        productoDiv.classList.add("error");

        productoDiv.textContent =
            "PRODUCTO NO REGISTRADO";

        precioDiv.textContent = codigo;
    }

    input.value = "";
});

</script>

</body>
</html>
